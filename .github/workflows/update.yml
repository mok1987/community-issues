name: 이슈 업데이트

on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다 (정각 혼잡 피해서 7분, 37분)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 수집 → 묶기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python run.py

      - name: 데이터 커밋
        run: |
          git config user.name "issue-bot"
          git config user.email "issue-bot@users.noreply.github.com"
          git add data/posts.json site/issues.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%FT%TZ)"
          # 그사이 다른 커밋이 올라왔으면 합쳐서 다시 올린다 (데이터 파일은 이번 실행 결과 우선)
          for i in 1 2 3; do
            git push && break
            git pull --rebase -X theirs origin main
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
