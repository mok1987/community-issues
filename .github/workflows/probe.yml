name: probe (임시 점검)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://news.daum.net/robots.txt https://news.daum.net/ranking/popular https://news.daum.net/ranking/popular/ https://news.daum.net/popular https://news.daum.net/ranking https://news.daum.net/ ; do
            code=$(curl -s -o /tmp/b -w '%{http_code} %{url_effective}' -A 'IssueBundleBot/0.1' -L "$u"); echo "== $u -> $code"
            if echo "$u" | grep -q robots; then cat /tmp/b | head -30; else grep -oE 'https?://v\.daum\.net/v/[0-9]+' /tmp/b | head -3; grep -oE 'href="[^"]*ranking[^"]*"' /tmp/b | sort -u | head -8; fi
          done
